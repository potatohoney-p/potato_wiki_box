<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title description">
  <title id="title">potato box knowledge loop</title>
  <desc id="description">Sources are ingested into linked Markdown, retrieved for chat and research, reviewed by a person, and checked for health and backup.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#788293"/>
    </marker>
    <style>
      .heading { font: 700 32px Inter, ui-sans-serif, system-ui, sans-serif; fill: #171A22; }
      .subheading { font: 400 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #626C7D; }
      .step { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #626C7D; }
      .label { font: 700 24px Inter, ui-sans-serif, system-ui, sans-serif; fill: #171A22; }
      .detail { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #515B6B; }
      .store { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #313746; }
    </style>
  </defs>

  <rect width="1600" height="620" fill="#F7F9FC"/>
  <text x="80" y="72" class="heading">From source material to durable knowledge</text>
  <text x="80" y="106" class="subheading">An inspectable loop with explicit review, recovery, and ownership at every stage.</text>

  <g fill="none" stroke="#788293" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 320 240 H 370"/>
    <path d="M 730 240 H 780"/>
    <path d="M 1190 240 H 1240"/>
    <path d="M 1420 330 V 382 H 1190"/>
    <path d="M 780 470 H 730"/>
    <path d="M 370 470 H 320"/>
    <path d="M 200 390 V 330"/>
  </g>

  <g>
    <rect x="80" y="160" width="240" height="160" rx="8" fill="#FFFFFF" stroke="#BAC2CE" stroke-width="2"/>
    <rect x="80" y="160" width="8" height="160" rx="4" fill="#326BFF"/>
    <text x="112" y="200" class="step">01</text>
    <text x="112" y="240" class="label">Capture</text>
    <text x="112" y="276" class="detail">Files, folders, web clips</text>

    <rect x="370" y="160" width="360" height="160" rx="8" fill="#FFFFFF" stroke="#BAC2CE" stroke-width="2"/>
    <rect x="370" y="160" width="8" height="160" rx="4" fill="#13A06F"/>
    <text x="402" y="200" class="step">02</text>
    <text x="402" y="240" class="label">Persistent ingest</text>
    <text x="402" y="276" class="detail">Parse, recover, deduplicate</text>

    <rect x="780" y="160" width="410" height="160" rx="8" fill="#FFFFFF" stroke="#BAC2CE" stroke-width="2"/>
    <rect x="780" y="160" width="8" height="160" rx="4" fill="#F39B2F"/>
    <text x="812" y="200" class="step">03</text>
    <text x="812" y="240" class="label">Linked Markdown</text>
    <text x="812" y="276" class="detail">YAML, wikilinks, provenance</text>

    <rect x="1240" y="160" width="280" height="160" rx="8" fill="#FFFFFF" stroke="#BAC2CE" stroke-width="2"/>
    <rect x="1240" y="160" width="8" height="160" rx="4" fill="#242833"/>
    <text x="1272" y="200" class="step">04</text>
    <text x="1272" y="240" class="label">Retrieve</text>
    <text x="1272" y="276" class="detail">Keyword, graph, vectors</text>

    <rect x="780" y="390" width="410" height="160" rx="8" fill="#FFFFFF" stroke="#BAC2CE" stroke-width="2"/>
    <rect x="780" y="390" width="8" height="160" rx="4" fill="#326BFF"/>
    <text x="812" y="430" class="step">05</text>
    <text x="812" y="470" class="label">Use and review</text>
    <text x="812" y="506" class="detail">Chat, research, lint, approval</text>

    <rect x="370" y="390" width="360" height="160" rx="8" fill="#FFFFFF" stroke="#BAC2CE" stroke-width="2"/>
    <rect x="370" y="390" width="8" height="160" rx="4" fill="#13A06F"/>
    <text x="402" y="430" class="step">06</text>
    <text x="402" y="470" class="label">Operate safely</text>
    <text x="402" y="506" class="detail">Health, diagnostics, backup</text>
  </g>

  <g>
    <rect x="80" y="390" width="240" height="160" rx="8" fill="#EEF2F7" stroke="#BAC2CE" stroke-width="2"/>
    <text x="112" y="432" class="step">YOUR PROJECT</text>
    <text x="112" y="470" class="store">raw/sources</text>
    <text x="112" y="500" class="store">wiki/*.md</text>
    <text x="112" y="530" class="store">.potato-box</text>
  </g>
</svg>
