<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>potato box Clipper</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 460px;
      min-height: 520px;
      margin: 0;
      font: 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17211b;
      background: #f7f8f6;
    }
    button, input, select { font: inherit; }
    .header {
      min-height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #dfe4df;
      background: #ffffff;
    }
    .brand { display: flex; align-items: center; gap: 9px; }
    .mark {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: #ffffff;
      background: #26734d;
      font-weight: 800;
    }
    h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0; }
    .link-button {
      padding: 4px 0;
      border: 0;
      color: #476052;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
    }
    main { padding: 14px 16px 16px; }
    .status {
      min-height: 34px;
      margin-bottom: 12px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 12px;
    }
    .status.connected, .status.success { border-color: #b7d9c7; color: #185c3b; background: #edf8f1; }
    .status.disconnected { border-color: #d9dedb; color: #526159; background: #f0f2f0; }
    .status.sending { border-color: #b9cddd; color: #274f6b; background: #eef5fa; }
    .status.error { border-color: #edc5c2; color: #8e2925; background: #fff1f0; }
    .token-panel {
      margin: -4px 0 12px;
      padding: 12px;
      border: 1px solid #dfe4df;
      border-radius: 6px;
      background: #ffffff;
    }
    .token-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .field { margin-bottom: 10px; }
    label {
      display: block;
      margin-bottom: 4px;
      color: #526159;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    input, select {
      width: 100%;
      min-height: 34px;
      padding: 6px 9px;
      border: 1px solid #cfd7d1;
      border-radius: 5px;
      color: #17211b;
      background: #ffffff;
      outline: none;
    }
    input:focus, select:focus { border-color: #26734d; box-shadow: 0 0 0 2px rgba(38, 115, 77, 0.14); }
    .secondary-button {
      min-height: 34px;
      padding: 6px 12px;
      border: 1px solid #26734d;
      border-radius: 5px;
      color: #ffffff;
      background: #26734d;
      cursor: pointer;
    }
    .url-preview {
      min-height: 28px;
      padding: 5px 8px;
      overflow: hidden;
      border: 1px solid #e1e5e2;
      border-radius: 5px;
      color: #65726a;
      background: #f1f3f1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #contentPreview {
      height: 180px;
      padding: 10px;
      overflow-y: auto;
      border: 1px solid #dfe4df;
      border-radius: 5px;
      color: #344239;
      background: #ffffff;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .primary-button {
      width: 100%;
      min-height: 40px;
      margin-top: 2px;
      border: 0;
      border-radius: 6px;
      color: #ffffff;
      background: #26734d;
      font-weight: 700;
      cursor: pointer;
    }
    .primary-button:hover:not(:disabled), .secondary-button:hover { background: #1d603e; }
    .primary-button:disabled { color: #7b8880; background: #dce1dd; cursor: not-allowed; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand"><span class="mark" aria-hidden="true">P</span><h1>potato box Clipper</h1></div>
    <button id="changeTokenBtn" class="link-button" type="button" hidden>Change token</button>
  </header>
  <main>
    <div id="statusBar" class="status disconnected" role="status">Connecting...</div>
    <section id="tokenPanel" class="token-panel" hidden>
      <label for="tokenInput">API token</label>
      <div class="token-row">
        <input id="tokenInput" type="password" autocomplete="off" spellcheck="false" placeholder="pbx_...">
        <button id="saveTokenBtn" class="secondary-button" type="button">Connect</button>
      </div>
    </section>
    <div class="field">
      <label for="projectSelect">Project</label>
      <select id="projectSelect"><option value="">Loading projects...</option></select>
    </div>
    <div class="field">
      <label for="titleInput">Title</label>
      <input id="titleInput" type="text" maxlength="500" placeholder="Page title">
    </div>
    <div class="field">
      <label>URL</label>
      <div id="urlPreview" class="url-preview">Loading...</div>
    </div>
    <div class="field">
      <label>Content preview</label>
      <div id="contentPreview">Extracting page...</div>
    </div>
    <button id="clipBtn" class="primary-button" type="button" disabled>Extracting page</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
